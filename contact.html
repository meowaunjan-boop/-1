<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crispy Crunch - ติดต่อเรา</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">CRUNCH!</div>
    <nav>
      <a href="index.html">หน้าแรก</a>
      <a href="services.html">บริการ & เมนู</a>
      <a href="work.html">ผลงาน/แกลเลอรี</a>
      <a href="process.html">กรรมวิธี</a>
      <a href="contact.html" class="active">ติดต่อเรา</a>
    </nav>
  </header>

  <main class="container">
    <div class="grid-2">
      <div>
        <h1>SAY HELLO! 👋</h1>
        <p style="font-size: 1.2rem; margin: 1rem 0 2rem 0;">หิวไก่ทอด หรือต้องการสอบถามเรื่องแฟรนไชส์ ทักหาเราได้ทันที</p>
        
        <div class="card-thick" style="background: var(--yellow-pop); margin-bottom: 1rem;">
          📍 <strong>ที่อยู่:</strong> 123 ถนนความอร่อย เขตพระนคร กรุงเทพฯ
        </div>
        <div class="card-thick" style="background: var(--peach-light);">
          📞 <strong>โทร:</strong> 081-234-5678
        </div>
      </div>

      <div class="card-thick" style="background: #FFF;">
        <h2 style="margin-bottom: 1.5rem;">ส่งข้อความหาเรา</h2>
        <form style="display: flex; flex-direction: column; gap: 1rem;">
          <input type="text" placeholder="ชื่อของคุณ" style="padding: 12px; border: var(--border-thick); border-radius: 8px; font-family: inherit;">
          <input type="email" placeholder="อีเมล / เบอร์โทรศัพท์" style="padding: 12px; border: var(--border-thick); border-radius: 8px; font-family: inherit;">
          <textarea rows="4" placeholder="ข้อความของคุณ..." style="padding: 12px; border: var(--border-thick); border-radius: 8px; font-family: inherit;"></textarea>
          <button type="button" class="btn-main" style="align-self: flex-start;">ส่งข้อความ 🚀</button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 CRISPY CRUNCH - ไก่ทอดโมเดิร์นสดใสสไตล์ Peach Cream</p>
  </footer>
</body>
</html>
